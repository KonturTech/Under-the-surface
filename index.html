<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under the Surface — Issue 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:     #101025;
    --navy2:    #1a1a38;
    --navy3:    #242445;
    --orange:   #D57041;
    --orange2:  #e8895a;
    --orange3:  #f5c4a8;
    --cream:    #F7F3EE;
    --cream2:   #EDE8E0;
    --text:     #F0EDE8;
    --text2:    #A8A4B8;
    --text3:    #6B6880;
    --white:    #FFFFFF;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--navy);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    line-height: 1.75;
    font-size: 16px;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: .6;
  }

  .page { position: relative; z-index: 1; }

  .header {
    background: var(--navy);
    border-bottom: 1px solid rgba(213,112,65,.25);
    padding: 0;
    overflow: hidden;
    position: relative;
  }
  .header-glow {
    position: absolute;
    top: -120px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 300px;
    background: radial-gradient(ellipse, rgba(213,112,65,.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-inner {
    max-width: 860px;
    margin: 0 auto;
    padding: 3.5rem 2rem 2.5rem;
    position: relative;
  }
  .issue-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--orange);
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }
  .issue-tag::before {
    content: '';
    display: block;
    width: 24px; height: 1px;
    background: var(--orange);
  }
  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 8vw, 5.5rem);
    font-weight: 700;
    line-height: .95;
    letter-spacing: -.02em;
    color: var(--white);
    margin-bottom: .5rem;
  }
  .header h1 span { color: var(--orange); font-style: italic; }
  .subtitle {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text2);
    letter-spacing: .08em;
    margin-bottom: 2rem;
    margin-top: .75rem;
  }
  .header-meta {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
    padding-top: 1.5rem;
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .header-meta span {
    font-size: 12px;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
  }
  .header-meta span strong { color: var(--text2); font-weight: 400; }

  .scanline {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--orange), transparent);
    opacity: .4;
    margin: 0;
  }

  .content {
    max-width: 860px;
    margin: 0 auto;
    padding: 3rem 2rem 5rem;
  }

  /* Benny note */
  .benny-note {
    background: linear-gradient(135deg, var(--navy3) 0%, #1d1b36 100%);
    border: 1px solid rgba(213,112,65,.2);
    border-radius: 16px;
    padding: 2rem 2.5rem;
    margin-bottom: 2rem;
    display: flex;
    gap: 2rem;
    align-items: flex-start;
    animation: fadeUp .4s ease both;
    position: relative;
    overflow: hidden;
  }
  .benny-note::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--orange), transparent);
  }
  .benny-photo {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 2px solid rgba(213,112,65,.35);
    box-shadow: 0 0 0 4px rgba(213,112,65,.08);
  }
  .benny-body { flex: 1; min-width: 0; }
  .benny-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: .4rem;
  }
  .benny-body h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--white);
    margin-bottom: .75rem;
    line-height: 1.2;
  }
  .benny-body p { font-size: 14px; color: var(--text2); line-height: 1.75; }
  .benny-sig {
    margin-top: 1rem;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--orange2);
  }
  @media (max-width: 560px) {
    .benny-note { flex-direction: column; align-items: center; text-align: center; }
    .benny-body h2 { font-size: 1.2rem; }
  }

  /* Easter banner */
  .easter-banner {
    background: linear-gradient(135deg, var(--navy3) 0%, #1e1a35 100%);
    border: 1px solid rgba(213,112,65,.3);
    border-radius: 16px;
    padding: 2.5rem 2.5rem;
    margin-bottom: 3rem;
    position: relative;
    overflow: hidden;
    animation: fadeUp .6s ease both;
  }
  .easter-banner::before {
    content: '🐣';
    position: absolute;
    right: 2rem; top: 50%;
    transform: translateY(-50%);
    font-size: 72px;
    opacity: .15;
    filter: grayscale(1);
  }
  .easter-banner h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--white);
    margin-bottom: .75rem;
    line-height: 1.2;
  }
  .easter-banner h2 em { color: var(--orange); font-style: italic; }
  .easter-banner p { font-size: 15px; color: var(--text2); max-width: 520px; line-height: 1.7; }

  /* Section label */
  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(213,112,65,.2);
  }

  /* Cards */
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    margin-bottom: 3rem;
    align-items: stretch;
  }
  .cards .card { height: 100%; display: flex; flex-direction: column; justify-content: flex-start; }
  @media (max-width: 620px) { .cards { grid-template-columns: 1fr; } }

  .card {
    background: var(--navy2);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 12px;
    padding: 1.75rem;
    position: relative;
    overflow: hidden;
    transition: border-color .2s, transform .2s;
    animation: fadeUp .5s ease both;
  }
  .card:hover { border-color: rgba(213,112,65,.35); transform: translateY(-2px); }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--orange), transparent);
    opacity: 0;
    transition: opacity .2s;
  }
  .card:hover::before { opacity: 1; }

  .card-icon { font-size: 28px; margin-bottom: 1rem; display: block; line-height: 1; }
  .card h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--white);
    margin-bottom: .6rem;
    line-height: 1.3;
  }
  .card p { font-size: 14px; color: var(--text2); line-height: 1.7; }
  .card-tag {
    display: inline-block;
    margin-top: 1rem;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--orange);
    background: rgba(213,112,65,.1);
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid rgba(213,112,65,.2);
  }

  /* Designit card */
  .card-designit { display: flex; flex-direction: column; gap: 0; }
  .card-designit .card-text { flex: 1; min-width: 0; }
  .card-designit .designit-img-wrap {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1.25rem;
  }
  .card-designit .designit-img-wrap img {
    width: 80%;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.08);
  }

  /* Radar */
  .radar {
    background: var(--navy2);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 12px;
    padding: 1.75rem 2rem;
    margin-bottom: 3rem;
    animation: fadeUp .5s ease both;
  }
  .radar-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--white);
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .radar-title span { font-size: 22px; }
  .event-row {
    display: flex;
    align-items: flex-start;
    gap: 1.25rem;
    padding: 1rem 0;
    border-bottom: 1px solid rgba(255,255,255,.05);
  }
  .event-row:last-child { border-bottom: none; padding-bottom: 0; }
  .event-date {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--orange);
    white-space: nowrap;
    min-width: 100px;
    padding-top: 2px;
    letter-spacing: .05em;
  }
  .event-info h4 { font-size: 14px; font-weight: 500; color: var(--white); margin-bottom: 2px; }
  .event-info p { font-size: 13px; color: var(--text2); }
  .event-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--orange);
    margin-top: 5px;
    flex-shrink: 0;
    box-shadow: 0 0 8px rgba(213,112,65,.5);
  }

  /* Product pulse */
  .product-pulse {
    background: linear-gradient(135deg, rgba(213,112,65,.08) 0%, transparent 60%);
    border: 1px solid rgba(213,112,65,.2);
    border-radius: 12px;
    padding: 1.75rem 2rem;
    margin-bottom: 3rem;
    animation: fadeUp .5s ease both;
  }
  .product-pulse h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--white);
    margin-bottom: .5rem;
  }
  .version-badge {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--navy);
    background: var(--orange);
    padding: 4px 14px;
    border-radius: 20px;
    font-weight: 500;
    margin-bottom: 1rem;
  }
  .product-pulse p { font-size: 14px; color: var(--text2); line-height: 1.7; }

  /* Closing */
  .closing {
    text-align: center;
    padding: 2.5rem 1rem;
    border-top: 1px solid rgba(255,255,255,.06);
    margin-top: 1rem;
    animation: fadeUp .5s ease both;
  }
  .closing p {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-style: italic;
    color: var(--text2);
    margin-bottom: 1.5rem;
    line-height: 1.6;
  }
  .closing-logo {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--text3);
  }
  .closing-logo strong { color: var(--orange); font-weight: 500; }

  .footer {
    background: rgba(0,0,0,.3);
    border-top: 1px solid rgba(255,255,255,.05);
    padding: 1.5rem 2rem;
    text-align: center;
  }
  .footer p {
    font-size: 11px;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
    letter-spacing: .04em;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .benny-note      { animation-delay: .0s; }
  .easter-banner   { animation-delay: .05s; }
  .card:nth-child(1) { animation-delay: .10s; }
  .card:nth-child(2) { animation-delay: .15s; }
  .radar           { animation-delay: .20s; }
  .product-pulse   { animation-delay: .25s; }
  .closing         { animation-delay: .30s; }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
    margin: 2.5rem 0;
  }

  .hl { color: var(--orange); font-weight: 500; }

  a.ext-link {
    color: var(--orange);
    text-decoration: none;
    border-bottom: 1px solid rgba(213,112,65,.4);
    transition: border-color .2s;
  }
  a.ext-link:hover { border-color: var(--orange); }

  /* Webinar banner */
  .webinar-banner {
    background: linear-gradient(135deg, var(--navy2) 0%, #1c1a35 100%);
    border: 1px solid rgba(213,112,65,.3);
    border-radius: 16px;
    padding: 2rem 2.5rem;
    margin-bottom: 3rem;
    display: flex;
    gap: 2rem;
    align-items: center;
    position: relative;
    overflow: hidden;
    animation: fadeUp .5s ease both;
    animation-delay: .18s;
  }
  .webinar-banner::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--orange), var(--orange2), transparent);
  }
  .webinar-banner::after {
    content: '';
    position: absolute;
    bottom: -60px; right: -60px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(213,112,65,.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .webinar-left { flex: 1; min-width: 0; }
  .webinar-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: .6rem;
  }
  .webinar-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--white);
    line-height: 1.2;
    margin-bottom: .35rem;
  }
  .webinar-date {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--orange2);
    letter-spacing: .08em;
    margin-bottom: .75rem;
  }
  .webinar-desc {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.7;
    max-width: 520px;
  }
  .webinar-right {
    flex-shrink: 0;
  }
  .webinar-date-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 90px;
    height: 90px;
    border-radius: 14px;
    background: rgba(213,112,65,.12);
    border: 1px solid rgba(213,112,65,.3);
    gap: 0;
  }
  .webinar-month {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: .15em;
    color: var(--orange);
    text-transform: uppercase;
    line-height: 1.4;
  }
  .webinar-day {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--white);
    line-height: 1;
  }
  .webinar-dow {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: .1em;
    color: var(--text3);
    text-transform: uppercase;
  }
  @media (max-width: 560px) {
    .webinar-banner { flex-direction: column; }
    .webinar-right { align-self: flex-start; }
  }
</style>

<div class="page">

  <header class="header">
    <div class="header-glow"></div>
    <div class="header-inner">
      <div class="issue-tag">Issue 01 &nbsp;·&nbsp; Spring 2026</div>
      <h1>Under the<br><span>Surface</span></h1>
      <p class="subtitle">// Ground Control to Kontur</p>
